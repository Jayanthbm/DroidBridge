name: verify

# Phase 0 gate: the shared protocol module and the Android shell must build, test and lint on a
# clean checkout. The macOS shell needs Xcode and is verified on the owner's machine
# (scripts/verify-all.sh), not here.
#
# Deliberately no caching of Gradle credentials, no signing material and no secrets: nothing in
# this workflow needs them, and a CI job that holds a key is a key that can leak.

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-protocol:
    name: shared protocol (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test
        working-directory: shared/protocol
        run: ./gradlew test --no-daemon

  android:
    name: android shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships an Android SDK; drive its sdkmanager directly. The third-party
      # setup-android action failed on this image ("Wrong version in preinstalled sdkmanager") and
      # crashed its own Node process before this job reached a single Gradle task.
      - name: Install required platform
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          echo "sdk=$SDK"
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.0" "platforms;android-37.1" "build-tools;37.0.0"
          ls "$SDK/platforms"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Assemble, test and lint
        working-directory: android
        run: |
          ./gradlew \
            :app:assembleDebug :app:testDebugUnitTest :app:lintDebug \
            :core:network:testDebugUnitTest :core:security:testDebugUnitTest \
            :experiments:media-projection:assembleDebug \
            :experiments:media-projection:testDebugUnitTest \
            :experiments:media-projection:lintDebug \
            :experiments:clipboard:assembleDebug \
            :experiments:clipboard:testDebugUnitTest \
            :experiments:clipboard:lintDebug \
            :experiments:session:assembleDebug \
            :experiments:session:testDebugUnitTest \
            :experiments:session:lintDebug \
            :feature:mirroring:assembleDebug \
            :feature:mirroring:testDebugUnitTest \
            :feature:mirroring:lintDebug \
            --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
