name: verify

# Phase 0 gate: the shared protocol module and the Android shell must build, test and lint on a
# clean checkout. The macOS shell needs Xcode and is verified on the owner's machine
# (scripts/verify-all.sh), not here.
#
# Deliberately no caching of Gradle credentials, no signing material and no secrets: nothing in
# this workflow needs them, and a CI job that holds a key is a key that can leak.

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-protocol:
    name: shared protocol (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test
        working-directory: shared/protocol
        run: ./gradlew test --no-daemon

  android:
    name: android shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required platform
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Assemble, test and lint
        working-directory: android
        run: |
          ./gradlew \
            :app:assembleDebug :app:testDebugUnitTest :app:lintDebug \
            :experiments:media-projection:assembleDebug \
            :experiments:media-projection:testDebugUnitTest \
            :experiments:media-projection:lintDebug \
            :experiments:clipboard:assembleDebug \
            :experiments:clipboard:testDebugUnitTest \
            :experiments:clipboard:lintDebug \
            --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
