# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# Build performance. Configuration cache is deliberately off until every module is verified
# against it; turning it on silently is how builds start failing only on a clean checkout.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
